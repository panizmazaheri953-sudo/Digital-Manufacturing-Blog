# Welcome to your manufacturing portfolio config
# This file controls your entire site

# Site Settings
title: "Precision Additive Manufacturing"
description: "Specialist manufacturer of plastic casings for modular electronics | Industry 4.0 Digital Manufacturing"
url: "https://yourusername.github.io" # CHANGE THIS to your actual URL
repository: "panizmazaheri953-sudo/Digital-Manufacturing-Blog" # CHANGE THIS

# Branding (appears in top bar)
masthead_title: "Precision AM"

# Author/Company Info
author:
  name: "Paniz Manufacturing Company"
  bio: "Additive manufacturing specialist producing interchangeable casings for automated assembly lines"
  location: "Manchester, UK"
  
# Site Navigation (top menu bar)
main_nav:
  - title: "Project: Phones-R-Us"
    url: /phones-r-us/
  - title: "Manufacturing Process"
    url: /process/
  - title: "Quality Control"
    url: /quality/
  - title: "Plant Simulation"
    url: /simulation/
  - title: "Final Report"
    url: /report/

# Default Settings
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: false
      related: false

# Theme
remote_theme: "mmistakes/minimal-mistakes@4.26.2"

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

# Include these directories
include:
  - _pages

# Exclude these files
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
